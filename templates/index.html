<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>

<body>
<div class="container mt-5">
<h1 class="text-center mb-4" style="color: rgb(33, 7, 7); font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Expense Tracker</h1>
    <h2>Add Expense</h2>
    <div class = "card p-4 shadow">
    <form action="/add" method="POST">
   
        <input type="text" name="title" class="form-control mb-3" placeholder="Enter Expense" required>
        <input type="number" name="amount" placeholder="Amount" min = "1" class = "form-control mb-3" required>
        <button type="submit" class = "btn btn-primary">Add</button>

    </form>
    </div>
    <hr>

    <h2>Expense List</h2>
    <div class=" card p-3 shadow">
    <table class="table table-striped table-bordered">
        <thead class ="table-dark">
        <tr>
            <th>Serial No.</th>
            <th>Title</th>
            <th>Amount</th>
            <th>Action</th>
        </tr>
        </thead>
        {% for e in expenses %}
        <tr>
            <td>{{loop.index}}</td>
            <td>{{e[1]}}</td>
            <td>₹{{e[2]}}</td>
            <td><a class = "btn btn-danger btn-sm" href ="/delete/{{e[0]}}">Delete</a></td>
            </tr>
        
        {% endfor%}
    </table>
    </div>

    <hr>
    <div class="card p-3 shadow text-center">
    <h3>Total Expense = ₹{{ total }}</h3>
    {% if expenses|length == 0 %}
    <p class="text-center">No expenses added yet</p>
    {% endif %}
    </div>
<hr>
</div>



</body>
</html>
